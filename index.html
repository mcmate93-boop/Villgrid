<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VillGrid</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="VillGrid">
<meta name="theme-color" content="#f5a623">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:-apple-system,sans-serif;background:#0a0e1a;color:#c8d8f0;overflow:hidden;}
body{display:flex;flex-direction:column;}
#top{background:#0f1628;border-bottom:1px solid #1e2d4a;padding:10px 14px;flex-shrink:0;}
#top h1{font-size:16px;font-weight:900;color:#fff;margin-bottom:8px;}
#top h1 span{color:#f5a623;}
#status{font-size:12px;color:#4a6080;margin-bottom:8px;}
.sr{display:flex;gap:8px;}
#si{flex:1;background:rgba(255,255,255,0.07);border:1px solid #1e2d4a;border-radius:8px;padding:10px 12px;color:#fff;font-size:16px;outline:none;}
#si::placeholder{color:#4a6080;}
#sb{padding:10px 18px;background:#f5a623;color:#000;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;}
#sb:active{opacity:0.8;}
#sb:disabled{opacity:0.4;}
#info{margin-top:6px;font-size:12px;color:#4a6080;min-height:15px;}
#map{flex:1;}
.leaflet-container{background:#07101f !important;}

/* DUPLIKÁLT VÁLASZTÓ */
#dupsheet{position:fixed;bottom:0;left:0;right:0;z-index:10000;background:#0f1628;border-top:2px solid #f5a623;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .25s ease;max-height:60vh;display:flex;flex-direction:column;}
#dupsheet.on{transform:translateY(0);}
#dup-h{width:36px;height:4px;background:#1e2d4a;border-radius:2px;margin:9px auto 0;flex-shrink:0;}
#dup-top{padding:12px 16px;border-bottom:1px solid #1e2d4a;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
#dup-title{font-size:15px;font-weight:800;color:#fff;}
#dup-sub{font-size:11px;color:#4a6080;margin-top:2px;}
#dup-x{background:none;border:1px solid #1e2d4a;color:#4a6080;width:30px;height:30px;border-radius:6px;font-size:16px;cursor:pointer;flex-shrink:0;}
#dup-list{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
.dup-item{padding:14px 16px;border-bottom:1px solid rgba(30,45,74,0.5);cursor:pointer;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;}
.dup-item:active{background:rgba(245,166,35,0.1);}
.dup-icon{width:36px;height:36px;border-radius:8px;background:rgba(245,166,35,0.12);border:1px solid rgba(245,166,35,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.dup-info{flex:1;}
.dup-tel{font-size:14px;font-weight:700;color:#fff;}
.dup-cim{font-size:12px;color:#4a6080;margin-top:2px;}
.dup-gps{font-size:10px;color:#2a4060;margin-top:2px;font-family:monospace;}
.dup-arrow{color:#f5a623;font-size:18px;}

/* DETAIL SHEET */
#sh{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#0f1628;border-top:2px solid #f5a623;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .25s ease;max-height:65vh;display:flex;flex-direction:column;}
#sh.on{transform:translateY(0);}
#sh-h{width:36px;height:4px;background:#1e2d4a;border-radius:2px;margin:9px auto 0;flex-shrink:0;}
#sh-top{padding:10px 16px;border-bottom:1px solid #1e2d4a;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
#sh-id{font-size:20px;font-weight:900;color:#fff;}
#sh-x{background:none;border:1px solid #1e2d4a;color:#4a6080;width:30px;height:30px;border-radius:6px;font-size:16px;cursor:pointer;}
#sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 8px;}
.dr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(30,45,74,0.5);gap:12px;}
.dr:last-child{border-bottom:none;}
.dk{font-size:11px;color:#4a6080;text-transform:uppercase;}
.dv{font-size:13px;color:#fff;font-weight:600;text-align:right;word-break:break-word;}
#sh-nav{margin:10px 16px 24px;padding:13px;background:#f5a623;color:#000;border:none;border-radius:10px;font-size:14px;font-weight:800;width:calc(100% - 32px);cursor:pointer;}

.leaflet-popup-content-wrapper{background:#0f1628 !important;border:1px solid #1e2d4a !important;border-radius:8px !important;}
.leaflet-popup-tip{background:#0f1628 !important;}
.pi{font-size:14px;font-weight:800;color:#fff;}
.ps{font-size:11px;color:#4a6080;margin-top:2px;}

#tabbar{display:flex;gap:0;background:#0f1628;border-bottom:1px solid #1e2d4a;flex-shrink:0;}
.tab{flex:1;padding:10px;border:none;background:none;color:#4a6080;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;-webkit-tap-highlight-color:transparent;}
.tab.aktiv{color:#f5a623;border-bottom-color:#f5a623;}
#loader{position:fixed;inset:0;background:#0a0e1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;}
#loader h2{color:#f5a623;font-size:22px;font-weight:900;margin-bottom:16px;}
#lbar{width:200px;height:6px;background:#1e2d4a;border-radius:3px;overflow:hidden;}
#lfill{height:100%;background:#f5a623;border-radius:3px;width:0%;transition:width 0.3s;}
#lmsg{color:#4a6080;font-size:12px;margin-top:10px;}
</style>
</head>
<body>

<div id="loader">
  <h2>⚡ VillGrid</h2>
  <div id="lbar"><div id="lfill"></div></div>
  <div id="lmsg">Adatok betöltése...</div>
</div>

<div id="top">
  <h1>⚡ Vill<span>Grid</span></h1>
  <div id="status">Betöltés...</div>
  <div class="sr">
    <input id="si" type="search" placeholder="Azonosító, pl. 10337" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
    <button id="sb" onclick="go()" disabled>Keres</button>
  </div>
  <div id="info"></div>
</div>

<div id="tabbar">
  <button class="tab aktiv" onclick="setTab('trafo',this)">⚡ Transzformátorok</button>
  <button class="tab" onclick="setTab('ok',this)">🔌 Oszlopkapcsolók</button>
</div>

<div id="map"></div>

<!-- DUPLIKÁLT VÁLASZTÓ -->
<div id="dupsheet">
  <div id="dup-h"></div>
  <div id="dup-top">
    <div>
      <div id="dup-title">Több találat</div>
      <div id="dup-sub">Válaszd ki a megfelelő transzformátort</div>
    </div>
    <button id="dup-x" onclick="closeDup()">✕</button>
  </div>
  <div id="dup-list"></div>
</div>

<!-- DETAIL SHEET -->
<div id="sh">
  <div id="sh-h"></div>
  <div id="sh-top">
    <div id="sh-id">–</div>
    <button id="sh-x" onclick="cls()">✕</button>
  </div>
  <div id="sh-body"></div>

  <!-- MEGJEGYZÉSEK -->
  <div style="padding:0 14px 6px;flex-shrink:0;">
    <div style="font-size:10px;color:#f5a623;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;">Megjegyzések</div>
    <div id="meg-lista" style="margin-bottom:8px;"></div>

    <div id="meg-form" style="display:none;flex-direction:column;gap:8px;margin-bottom:8px;">
      <input id="meg-nev" type="text" placeholder="Neved..." autocomplete="off" style="background:rgba(255,255,255,0.06);border:1px solid #1e2d4a;border-radius:8px;padding:9px 12px;color:#fff;font-size:14px;outline:none;width:100%;">
      <textarea id="meg-szoveg" placeholder="Megjegyzés (pl. kapukód, bejárat helye...)" style="background:rgba(255,255,255,0.06);border:1px solid #1e2d4a;border-radius:8px;padding:9px 12px;color:#fff;font-size:14px;outline:none;width:100%;resize:none;height:72px;font-family:inherit;"></textarea>
      <div style="display:flex;gap:8px;">
        <button onclick="megMent()" style="flex:1;padding:10px;background:#f5a623;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;">Mentés</button>
        <button onclick="megMegse()" style="flex:1;padding:10px;background:rgba(255,255,255,0.06);color:#c8d8f0;border:1px solid #1e2d4a;border-radius:8px;font-size:13px;cursor:pointer;">Mégse</button>
      </div>
    </div>

    <button id="meg-btn" onclick="megUj()" style="width:100%;padding:10px;background:rgba(245,166,35,0.1);border:1px dashed rgba(245,166,35,0.4);border-radius:8px;color:#f5a623;font-size:13px;font-weight:700;cursor:pointer;">+ Megjegyzés hozzáadása</button>
  </div>

  <div style="padding:10px 14px 20px;display:flex;gap:8px;flex-shrink:0;">
    <button onclick="nav()" style="flex:1;padding:12px;background:#f5a623;color:#000;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;">📍 Navigálás</button>
    <button onclick="cls()" style="flex:1;padding:12px;background:rgba(255,255,255,0.06);color:#c8d8f0;border:1px solid #1e2d4a;border-radius:10px;font-size:13px;cursor:pointer;">Bezárás</button>
  </div>
</div>

<script>
var D = null;
var map, ml, mm = {}, filt = null, cur = null;

// Service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/Villgrid/sw.js');
  });
}

// Online/offline jelző
window.addEventListener('online',  function() {
  var s = document.getElementById('status');
  s.style.color = '#4a6080';
  s.textContent = D ? D.length.toLocaleString('hu') + ' db betöltve' : 'Online';
});
window.addEventListener('offline', function() {
  var s = document.getElementById('status');
  s.style.color = '#ffc107';
  s.textContent = '📵 Offline – utolsó mentett adatok';
});

map = L.map('map',{center:[47.16,19.5],zoom:7});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
ml = L.layerGroup().addTo(map);

var DOK = null;
var aktifTab = 'trafo';

function setTab(tab, el) {
  aktifTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('aktiv');});
  el.classList.add('aktiv');
  filt = null;
  document.getElementById('si').value = '';
  document.getElementById('info').textContent = '';
  if (tab === 'trafo') {
    document.getElementById('si').placeholder = 'Azonosító, pl. 10337';
    document.getElementById('status').textContent = D ? D.length.toLocaleString('hu')+' db transzformátor' : 'Betöltés...';
  } else {
    document.getElementById('si').placeholder = 'OK szám, pl. 49604';
    document.getElementById('status').textContent = DOK ? DOK.length.toLocaleString('hu')+' db oszlopkapcsoló' : 'Betöltés...';
  }
  draw();
}

function loadData() {
  document.getElementById('lmsg').textContent = 'Adatok letöltése...';
  document.getElementById('lfill').style.width = '30%';
  var s = document.createElement('script');
  s.src = 'data.js';
  s.onload = function() {
    document.getElementById('lfill').style.width = '80%';
    document.getElementById('lmsg').textContent = 'Térkép felépítése...';
    setTimeout(init, 100);
  };
  s.onerror = function() {
    document.getElementById('lmsg').textContent = '❌ Hiba az adatok betöltésekor';
  };
  document.head.appendChild(s);
}

function init() {
  document.getElementById('lfill').style.width = '100%';
  document.getElementById('status').textContent = D.length.toLocaleString('hu') + ' db transzformátor';
  document.getElementById('si').disabled = false;
  document.getElementById('sb').disabled = false;
  document.getElementById('loader').style.display = 'none';
  // data_ok.js betöltése
  if (!DOK) {
    var s2 = document.createElement('script');
    s2.src = 'data_ok.js';
    s2.onload = function() {
      if (aktifTab==='ok') {
        document.getElementById('status').textContent = DOK.length.toLocaleString('hu')+' db oszlopkapcsoló';
        draw();
      }
    };
    document.head.appendChild(s2);
  }
  map.on('moveend zoomend', draw);
  draw();
  document.getElementById('si').addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.keyCode===13){e.preventDefault();go();}
  });
}

function draw(){
  var activeData = aktifTab==='trafo' ? D : DOK;
  if(!activeData) return;
  var b=map.getBounds();
  var src=filt||activeData;
  var vis=[],LIMIT=400;
  for(var i=0;i<src.length&&vis.length<LIMIT;i++){
    var o=src[i];
    if(o[1]>=b.getSouth()-.05&&o[1]<=b.getNorth()+.05&&
       o[2]>=b.getWest()-.05&&o[2]<=b.getEast()+.05) vis.push(o);
  }
  ml.clearLayers(); mm={};
  for(var j=0;j<vis.length;j++) mkr(vis[j],18);
}

function mkr(o,s){
  var isOK = aktifTab==='ok';
  var col = isOK ? '#00bcd4' : '#f5a623';
  var bg = isOK ? '#00bcd415' : '#f5a62315';
  var em = isOK ? '🔌' : '⚡';
  var ic=L.divIcon({className:'',
    html:'<div style="width:'+s+'px;height:'+s+'px;background:'+bg+';border:2px solid '+col+';border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:'+(s*.5)+'px;">'+em+'</div>',
    iconSize:[s,s],iconAnchor:[s/2,s/2]});
  var m=L.marker([o[1],o[2]],{icon:ic})
    .bindPopup('<div class="pi">'+o[0]+'</div><div class="ps">'+o[3]+'</div>',{maxWidth:200})
    .on('click',function(){handleMarkerClick(o[0]);});
  ml.addLayer(m); mm[o[0]+'_'+o[1]+'_'+o[2]]=m;
}

function handleMarkerClick(aid) {
  var activeData = aktifTab==='trafo' ? D : DOK;
  var matches = [];
  for(var i=0;i<activeData.length;i++){
    if(activeData[i][0]===aid) matches.push(activeData[i]);
  }
  if(matches.length===1){
    showDetail(matches[0]);
  } else {
    showDupSheet(matches);
  }
}

function go(){
  var activeData = aktifTab==='trafo' ? D : DOK;
  if(!activeData) return;
  var q=document.getElementById('si').value.replace(/\s/g,'').toLowerCase();
  var inf=document.getElementById('info');
  if(!q){filt=null;draw();inf.textContent='';return;}

  var r=[];
  for(var i=0;i<activeData.length;i++){
    var o=activeData[i];
    if(o[0].toLowerCase().indexOf(q)>=0||o[3].toLowerCase().replace(/\s/g,'').indexOf(q)>=0) r.push(o);
  }

  filt=r;
  ml.clearLayers(); mm={};
  var show=r.slice(0,400);
  for(var j=0;j<show.length;j++) mkr(show[j],22);

  // Pontos egyezés keresése (egy azonosítóra)
  var exactMatches=[];
  for(var k=0;k<activeData.length;k++){
    if(activeData[k][0].toLowerCase()===q) exactMatches.push(activeData[k]);
  }

  if(exactMatches.length===1){
    inf.textContent='"'+q+'" → 1 találat';
    map.setView([exactMatches[0][1],exactMatches[0][2]],16);
    showDetail(exactMatches[0]);
    setTimeout(function(){if(mm[exactMatches[0][0]])mm[exactMatches[0][0]].openPopup();},300);
  } else if(exactMatches.length>1){
    inf.textContent='"'+q+'" → '+exactMatches.length+' azonos azonosítójú találat';
    showDupSheet(exactMatches);
    var g=L.featureGroup(Object.values(mm));
    if(g.getLayers().length) map.fitBounds(g.getBounds().pad(0.3));
  } else if(r.length>0){
    inf.textContent='"'+q+'" → '+r.length+' találat';
    if(r.length<=200){
      var g2=L.featureGroup(Object.values(mm));
      if(g2.getLayers().length) map.fitBounds(g2.getBounds().pad(0.25));
    }
  } else {
    inf.textContent='"'+q+'" → 0 találat · próbáld rövidebben';
  }
}

// DUPLIKÁLT VÁLASZTÓ
function showDupSheet(matches) {
  document.getElementById('dup-title').textContent = matches[0][0] + ' azonosító';
  document.getElementById('dup-sub').textContent = matches.length + ' transzformátor – válaszd ki a megfelelőt';
  var html='';
  for(var i=0;i<matches.length;i++){
    var o=matches[i];
    var tel = o[3] || o[4] || '–';
    var cim = o[3] && o[4] ? o[4] : '';
    html+='<div class="dup-item" onclick="pickDup('+i+',\''+encodeURIComponent(JSON.stringify(o))+'\')">'  +
      '<div class="dup-icon">⚡</div>'+
      '<div class="dup-info">'+
        '<div class="dup-tel">'+tel+'</div>'+
        (cim?'<div class="dup-cim">'+cim+'</div>':'')+
        '<div class="dup-gps">'+o[1].toFixed(4)+', '+o[2].toFixed(4)+'</div>'+
      '</div>'+
      '<div class="dup-arrow">›</div>'+
    '</div>';
  }
  document.getElementById('dup-list').innerHTML=html;
  // Store matches globally for onclick
  window._dupMatches = matches;
  document.getElementById('dupsheet').classList.add('on');
}

function pickDup(idx) {
  var o = window._dupMatches[idx];
  closeDup();
  map.setView([o[1],o[2]],16);
  if(aktifTab==='trafo'){showDetail(o);}else{showDetail(o);}
}

function closeDup(){
  document.getElementById('dupsheet').classList.remove('on');
}

function showDetail(o){
  cur=o;
  document.getElementById('sh-id').textContent=o[0];
  var h='';
  if(aktifTab==='trafo'){
    if(o[3]) h+=dr('Cím',o[3]);
    if(o[4]) h+=dr('Megye',o[4]);
    if(o[5]) h+=dr('EOV X',o[5]);
    if(o[6]) h+=dr('EOV Y',o[6]);
  } else {
    if(o[3]) h+=dr('Település',o[3]);
    if(o[4]) h+=dr('Típus',o[4]);
    if(o[5]) h+=dr('Állapot','<span style="color:'+(o[5]==='bekapcsolt'?'#00e676':'#ff1744')+'">'+o[5]+'</span>');
    if(o[6]) h+=dr('Feszültség',o[6]);
    if(o[7]) h+=dr('EOV X',o[7]);
    if(o[8]) h+=dr('EOV Y',o[8]);
  }
  h+=dr('GPS','<span style="font-size:11px;font-family:monospace">'+o[1]+', '+o[2]+'</span>');
  document.getElementById('sh-body').innerHTML=h;
  document.getElementById('meg-lista').innerHTML='';
  document.getElementById('meg-form').style.display='none';
  document.getElementById('meg-btn').style.display='block';
  document.getElementById('sh').classList.add('on');
  betoltMegjegyzesek(o[0]);
}

function dr(k,v){return '<div class="dr"><span class="dk">'+k+'</span><span class="dv">'+v+'</span></div>';}
function cls(){document.getElementById('sh').classList.remove('on');cur=null;}
function nav(){if(!cur)return;window.open('https://www.google.com/maps/dir/?api=1&destination='+cur[1]+','+cur[2],'_blank');}

// ===== FIREBASE MEGJEGYZÉSEK =====
var FB_URL = 'https://villgrid-da1f8-default-rtdb.europe-west1.firebasedatabase.app/megjegyzesek';

function fbGet(aid, cb) {
  fetch(FB_URL+'/'+aid.replace(/[^a-zA-Z0-9]/g,'_')+'.json')
    .then(function(r){return r.json();})
    .then(function(d){cb(d);})
    .catch(function(){cb(null);});
}

function fbPost(aid, adat, cb) {
  fetch(FB_URL+'/'+aid.replace(/[^a-zA-Z0-9]/g,'_')+'.json', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(adat)
  }).then(function(){cb&&cb();}).catch(function(){cb&&cb();});
}

function betoltMegjegyzesek(aid) {
  var lista = document.getElementById('meg-lista');
  lista.innerHTML = '<div style="font-size:11px;color:#4a6080;padding:4px 0;">Betöltés...</div>';
  fbGet(aid, function(d) {
    lista.innerHTML = '';
    if (!d) {
      lista.innerHTML = '<div style="font-size:11px;color:#4a6080;padding:4px 0;">Még nincs megjegyzés.</div>';
      return;
    }
    var keys = Object.keys(d);
    if (keys.length === 0) {
      lista.innerHTML = '<div style="font-size:11px;color:#4a6080;padding:4px 0;">Még nincs megjegyzés.</div>';
      return;
    }
    // Legújabb elöl
    keys.sort(function(a,b){ return (d[b].ts||0)-(d[a].ts||0); });
    keys.forEach(function(k) {
      var m = d[k];
      var div = document.createElement('div');
      div.style.cssText = 'background:rgba(255,255,255,0.04);border-radius:8px;padding:9px 11px;margin-bottom:7px;border-left:3px solid #f5a623;';
      var datum = m.ts ? new Date(m.ts).toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      div.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">'+
          '<span style="font-size:12px;font-weight:700;color:#fff;">'+m.nev+'</span>'+
          '<span style="font-size:10px;color:#4a6080;">'+datum+'</span>'+
        '</div>'+
        '<div style="font-size:12px;color:#c8d8f0;line-height:1.5;">'+m.szoveg+'</div>';
      lista.appendChild(div);
    });
  });
}

function megUj() {
  document.getElementById('meg-form').style.display='flex';
  document.getElementById('meg-btn').style.display='none';
}
function megMegse() {
  document.getElementById('meg-form').style.display='none';
  document.getElementById('meg-btn').style.display='block';
}
function megMent() {
  var nev = document.getElementById('meg-nev').value.trim();
  var szoveg = document.getElementById('meg-szoveg').value.trim();
  if (!nev || !szoveg) { alert('Kérlek töltsd ki mindkét mezőt!'); return; }
  if (!cur) return;
  var adat = { nev:nev, szoveg:szoveg, ts:Date.now() };
  fbPost(cur[0], adat, function() {
    document.getElementById('meg-nev').value = '';
    document.getElementById('meg-szoveg').value = '';
    megMegse();
    betoltMegjegyzesek(cur[0]);
  });
}

var ty=0;
document.getElementById('sh').addEventListener('touchstart',function(e){ty=e.touches[0].clientY;},{passive:true});
document.getElementById('sh').addEventListener('touchend',function(e){if(e.changedTouches[0].clientY-ty>60)cls();},{passive:true});
document.getElementById('dupsheet').addEventListener('touchstart',function(e){ty=e.touches[0].clientY;},{passive:true});
document.getElementById('dupsheet').addEventListener('touchend',function(e){if(e.changedTouches[0].clientY-ty>60)closeDup();},{passive:true});

loadData();
</script>
